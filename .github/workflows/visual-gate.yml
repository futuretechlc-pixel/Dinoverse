name: Dinoverse Visual Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-gate.yml'
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'shaders/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-import-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check asset bootstrap syntax
        run: python -m py_compile tools/fetch_visual_assets.py

      - name: Fetch production visual assets
        run: python tools/fetch_visual_assets.py

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run startup scene smoke test
        run: godot --headless --path . --quit-after 8

      - name: Write visual gate report
        if: always()
        run: |
          mkdir -p dist
          {
            echo "Dinoverse Visual Gate"
            echo "Godot: $(godot --version || true)"
            echo "Downloaded GLB assets:"
            find assets -name '*.glb' -type f -printf '%P %s bytes\n' 2>/dev/null | sort
          } > dist/visual-gate-report.txt

      - name: Upload validation report (no source mesh redistribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dinoverse-Visual-Gate-Report
          path: dist/visual-gate-report.txt
          if-no-files-found: error
          retention-days: 30
